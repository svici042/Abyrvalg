<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#49634d" />
    <meta
      name="description"
      content="Utforsk produkter, finn nye favoritter og lag din egen handlekurv i Abyrvalg."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyrvalg små funn, store muligheter</title>
    <script>
      const redirect = sessionStorage.getItem('github-pages-redirect')
      if (redirect) {
        sessionStorage.removeItem('github-pages-redirect')
        const destination = new URL(redirect)
        const baseUrl = '%BASE_URL%'
        if (
          destination.origin === window.location.origin &&
          destination.pathname.startsWith(baseUrl)
        ) {
          window.history.replaceState(
            null,
            '',
            `${destination.pathname}${destination.search}${destination.hash}`,
          )
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
